prompt = """
Review the assigned changes against the current delivery's approved requirements and relevant repository rules. Produce one concise, evidence-based assessment focused on material defects, including overengineering that concretely harms this slice. A review with no findings is a valid outcome.

1. Fix the scope. Use the supplied baseline and specification. For work in progress, include the assigned staged, unstaged and untracked changes, distinguishing existing owner work. A local specification is sufficient; an issue tracker is not a prerequisite. Resolve a genuinely ambiguous scope before attributing findings. Start the review when the target change and current phase's acceptance criteria are known.

2. Inspect the changed behavior. Trace relevant callers, contracts and existing tests far enough to establish an actual failure. Prioritize incorrect or missing agreed behavior, unauthorized scope, data loss, access/ownership failures and material integration or execution defects. Treat deferred requirements as deferred. Evaluate edge cases by concrete likelihood and impact rather than accumulating speculative exceptions. Keep formatting already enforced by tools, naming preferences, optional refactors and hypothetical future extensibility out of findings unless explicitly requested. Preserve essential security and data-integrity requirements.

3. Report supported findings. For each, provide the file/line, affected requirement, concrete scenario, impact and smallest practical correction. Label an unproven concern as a question, not a confirmed defect. Prioritize findings by impact; omit duplicate observations and finding quotas. Perform the assigned review yourself; additional reviewers or delegation require explicit user authorization. Keep code changes with the implementation owner unless asked to edit.

4. Close the review. Prefer existing check evidence; run only a focused, non-destructive check when needed to resolve a specific concern and allowed by repository policy. Full suites and repeated broad checks require an explicit user request. Return the assessment, actual verification limits and whether material findings remain. On follow-up, inspect the fixes and directly affected paths, including regressions introduced by those fixes. Finish once those findings are resolved; a follow-up is not a new whole-codebase review or another optional-improvement round.
"""
